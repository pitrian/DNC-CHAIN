[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
ffi = true

[profile.coverage]
verbosity = 3

[profile.gas]
gas_reports = ["*"]
gas_reports_include = ["DNC"]

remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/"
]
