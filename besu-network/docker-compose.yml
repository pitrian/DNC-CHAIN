version: '3.8'

services:
  node1:
    image: hyperledger/besu:24.12.1
    container_name: dnc-besu-node1
    command: >
      --data-path=/data
      --genesis-file=/config/genesis.json
      --node-private-key-file=/data/key
      --p2p-host=node1
      --p2p-port=30303
      --rpc-http-enabled=true
      --rpc-http-host=0.0.0.0
      --rpc-http-port=8545
      --rpc-http-api=ADMIN,CLIQUE,ETH,NET,QBFT,TRACE,TXPOOL,WEB3
      --rpc-ws-enabled=true
      --rpc-ws-host=0.0.0.0
      --rpc-ws-port=8546
      --host-allowlist=*
      --rpc-http-cors-origins=*
      --logging=INFO
    volumes:
      - ./config:/config:ro
      - ./data/node1:/data
    ports:
      - "8545:8545"
      - "8546:8546"
      - "30303:30303"
    networks:
      - dnc-besu

  node2:
    image: hyperledger/besu:24.12.1
    container_name: dnc-besu-node2
    command: >
      --data-path=/data
      --genesis-file=/config/genesis.json
      --node-private-key-file=/data/key
      --p2p-host=node2
      --p2p-port=30303
      --rpc-http-enabled=true
      --rpc-http-host=0.0.0.0
      --rpc-http-port=8545
      --rpc-http-api=ADMIN,CLIQUE,ETH,NET,QBFT,TRACE,TXPOOL,WEB3
      --rpc-ws-enabled=true
      --rpc-ws-host=0.0.0.0
      --rpc-ws-port=8546
      --host-allowlist=*
      --rpc-http-cors-origins=*
      --logging=INFO
      --bootnodes=enode://${NODE1_NODEID}@node1:30303
    volumes:
      - ./config:/config:ro
      - ./data/node2:/data
    networks:
      - dnc-besu

  node3:
    image: hyperledger/besu:24.12.1
    container_name: dnc-besu-node3
    command: >
      --data-path=/data
      --genesis-file=/config/genesis.json
      --node-private-key-file=/data/key
      --p2p-host=node3
      --p2p-port=30303
      --rpc-http-enabled=true
      --rpc-http-host=0.0.0.0
      --rpc-http-port=8545
      --rpc-http-api=ADMIN,CLIQUE,ETH,NET,QBFT,TRACE,TXPOOL,WEB3
      --rpc-ws-enabled=true
      --rpc-ws-host=0.0.0.0
      --rpc-ws-port=8546
      --host-allowlist=*
      --rpc-http-cors-origins=*
      --logging=INFO
      --bootnodes=enode://${NODE1_NODEID}@node1:30303
    volumes:
      - ./config:/config:ro
      - ./data/node3:/data
    networks:
      - dnc-besu

  node4:
    image: hyperledger/besu:24.12.1
    container_name: dnc-besu-node4
    command: >
      --data-path=/data
      --genesis-file=/config/genesis.json
      --node-private-key-file=/data/key
      --p2p-host=node4
      --p2p-port=30303
      --rpc-http-enabled=true
      --rpc-http-host=0.0.0.0
      --rpc-http-port=8545
      --rpc-http-api=ADMIN,CLIQUE,ETH,NET,QBFT,TRACE,TXPOOL,WEB3
      --rpc-ws-enabled=true
      --rpc-ws-host=0.0.0.0
      --rpc-ws-port=8546
      --host-allowlist=*
      --rpc-http-cors-origins=*
      --logging=INFO
      --bootnodes=enode://${NODE1_NODEID}@node1:30303
    volumes:
      - ./config:/config:ro
      - ./data/node4:/data
    networks:
      - dnc-besu

networks:
  dnc-besu:
    driver: bridge
